name: Test GeoIP service

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm run build

  production:
    needs: unit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the live GeoIP API and the canonical Quantumult X script
        shell: bash
        run: |
          set -euo pipefail
          host=https://qx-ip2region.harlanho4.workers.dev

          # A push may reach GitHub Actions before the Cloudflare build is deployed.
          ready=0
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 10 "$host/health" -o /tmp/qx-health.json \
              && jq -e '.ok == true and .scriptVersion == "classic"' /tmp/qx-health.json >/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          jq -e '.ok == true and .initialized == true and
            .scriptVersion == "classic" and
            (.versions.v4 | length) == 40 and (.versions.v6 | length) == 40' /tmp/qx-health.json

          curl -fsS --retry 3 --retry-delay 2 "$host/geo" \
            -o /tmp/qx-geo.json \
            -w 'GeoIP total seconds: %{time_total}\n'
          jq -e '.status == "success" and (.query | length) > 0 and
            (.country | length) > 0' /tmp/qx-geo.json

          curl -fsS --retry 3 --retry-delay 2 -D /tmp/qx-headers \
            "$host/qx.js" -o /tmp/qx-script.js
          grep -qi '^x-qx-script-version: classic' /tmp/qx-headers
          grep -qi '^cache-control: no-store' /tmp/qx-headers
          node --check /tmp/qx-script.js

          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const script = fs.readFileSync("/tmp/qx-script.js", "utf8");
          const body = fs.readFileSync("/tmp/qx-geo.json", "utf8");
          let result;
          vm.runInNewContext(script, {
            $response: { statusCode: 200, body },
            $done(value) { result = value; }
          }, { timeout: 2000 });
          if (!result || !result.title || !result.subtitle || !result.ip ||
              !result.description || result.title.includes("查询失败")) {
            throw new Error("GeoIP script did not produce a valid display");
          }
          console.log("Live Quantumult X rendering passed");
          NODE
